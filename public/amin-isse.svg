<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="540" height="960" fill="url(#bgGrad)" />
  <circle cx="270" cy="360" r="280" fill="url(#glow)" />
  <!-- Silhouette / Avatar Graphic -->
  <g transform="translate(270, 380)">
    <!-- Head & Shoulders -->
    <path d="M-140,280 C-140,180 -80,140 0,140 C80,140 140,180 140,280 Z" fill="#1E293B" stroke="#334155" stroke-width="4" />
    <circle cx="0" cy="0" r="95" fill="#334155" stroke="#475569" stroke-width="4" />
    <circle cx="0" cy="-10" r="85" fill="#1E293B" />
    <!-- Camera icon overlay -->
    <rect x="-35" y="-30" width="70" height="50" rx="10" fill="#2563EB" opacity="0.9" />
    <circle cx="0" cy="-5" r="15" fill="#0B0F17" />
    <circle cx="0" cy="-5" r="8" fill="#38BDF8" />
    <rect x="-15" y="-40" width="30" height="12" rx="4" fill="#38BDF8" />
  </g>
  <!-- Developer Badge -->
  <rect x="70" y="700" width="400" height="140" rx="20" fill="#111827" fill-opacity="0.9" stroke="#334155" stroke-width="2" />
  <text x="270" y="745" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Amin Isse</text>
  <text x="270" y="775" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="600" font-size="14" fill="#38BDF8">Lead Developer &amp; Architect</text>
  <text x="270" y="805" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Event Photo Branding Studio</text>
</svg>
