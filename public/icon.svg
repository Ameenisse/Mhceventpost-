<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#brandBlue)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Camera Body & Photo Canvas Container -->
  <rect x="76" y="116" width="360" height="280" rx="36" fill="#111827" stroke="#334155" stroke-width="6" />

  <!-- Top Flash / Pentaprism bump -->
  <path d="M 196 116 L 224 74 L 288 74 L 316 116 Z" fill="#1E293B" stroke="#334155" stroke-width="5" />
  <circle cx="340" cy="98" r="8" fill="#EF4444" />

  <!-- Outer Lens Ring -->
  <circle cx="256" cy="256" r="92" fill="#0F172A" stroke="url(#brandBlue)" stroke-width="10" filter="url(#glow)" />

  <!-- Inner Lens Aperture Ring -->
  <circle cx="256" cy="256" r="68" fill="url(#lensGrad)" />
  <circle cx="256" cy="256" r="42" fill="#090D16" />
  <circle cx="270" cy="242" r="14" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="282" cy="232" r="5" fill="#93C5FD" />

  <!-- Branding Lower Banner on Camera/Photo -->
  <rect x="76" y="326" width="360" height="70" rx="0" fill="url(#brandBlue)" />
  <rect x="76" y="360" width="360" height="36" rx="0" fill="#0F172A" fill-opacity="0.85" />

  <!-- Event Branding Accent Stars & Typography lines -->
  <circle cx="120" cy="360" r="14" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="150" y="352" width="120" height="8" rx="4" fill="#FFFFFF" />
  <rect x="150" y="368" width="80" height="6" rx="3" fill="#93C5FD" fill-opacity="0.8" />

  <!-- Sponsor dots on lower banner -->
  <circle cx="370" cy="360" r="10" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="402" cy="360" r="8" fill="#CBD5E1" fill-opacity="0.8" />
</svg>
